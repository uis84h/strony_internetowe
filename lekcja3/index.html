<!DOCTYPE html>
<html lang="pl">
<head>

  <title>Karta Gracza</title>
  <link rel="stylesheet" href="style.css">

<body>
  <main class="player-card">

        <li>Pogromca UFO</li>

     <footer class="card-footer">
      <p>
        Ostatnia aktywność:
        <time dateline="2633-10-14">14 października 2633</time>
      </p>
