<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktywna strona</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Moja interaktywna strona</h1>
    <div class="container">
        <div class="card">
            <h2>Licznik</h2>
            <p id="counter-display">0</p>
            <!-- TODO: dodaj przycisk zwiększający licznik -->
             <button onclick="addPoint()">+1</button>
             <button onclick="resetPoint()">Reset</button>
        </div>
        <div class="card">
            <h2>Losowanie</h2>
            <p id="random-display">Kliknij i sprawdź!</p>
            <!-- TODO: dodaj przycisk uruchamiający losowanie -->
             <button onclick="drawItem()">Losuj!</button>
        </div>
        <div class="card">
            <h2>Widget</h2>
            <!-- TODO: osadź zewnętrzny widget za pomocą iframe -->
             <iframe 
             src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d325517.5124080704!2d30.20303884017131!3d50.401870189008235!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x40d4cf4ee15a4505%3A0x764931d2170146fe!2sKij%C3%B3w%2C%20Ukraina%2C%2002000!5e0!3m2!1spl!2spl!4v1795342468986!5m2!1spl!2spl" 
             width="200" 
             height="100" 
             style="border:0;" 
             allowfullscreen="" 
             loading="lazy" 
             referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
        <div class="card">
            <h2>Wideo</h2>
            <iframe 
            width="200" 
            height="100" 
            src="https://www.youtube.com/embed/V1RPi2MYptM?si=wwYjfn6XmBgltRXk" title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            referrerpolicy="strict-origin-when-cross-origin" 
            allowfullscreen></iframe>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
